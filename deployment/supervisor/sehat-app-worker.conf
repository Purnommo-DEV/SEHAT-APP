[program:sehat-app-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/sehat-app/artisan queue:work redis --queue=broadcasts,default --sleep=1 --tries=3 --backoff=3 --timeout=120 --max-time=3600
directory=/var/www/sehat-app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/sehat-app/storage/logs/worker.log
stopwaitsecs=3600

