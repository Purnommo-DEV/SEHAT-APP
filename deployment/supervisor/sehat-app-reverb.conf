[program:sehat-app-reverb]
command=/usr/bin/php /var/www/sehat-app/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/sehat-app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/sehat-app/storage/logs/reverb.log
stopwaitsecs=30

